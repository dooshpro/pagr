<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>pagr</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1><a href="/">pagr</a></h1>
  <p>pages for the people.</p>

  <div id="create-view">
    <h2>create a page</h2>
    <form id="create-form">
      <label for="content">content (required)</label><br>
      <textarea id="content" rows="12" maxlength="50000" required></textarea>
      <p>markdown works: <code># heading</code> <code>**bold**</code> <code>[text](url)</code> <code>![alt](image url)</code></p>
      <p>
        <button type="submit" id="save-btn">save and done</button>
        <span id="status"></span>
      </p>
    </form>

    <div id="result" hidden>
      <p>page saved. its address is:</p>
      <p><a id="result-link" href="/"></a></p>
      <button id="again-btn" type="button">make another</button>
    </div>
  </div>

  <div id="page-view" hidden>
    <p id="page-status"></p>
    <div id="page-content"></div>
    <hr>
    <p><a href="/">create your own page</a></p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js"></script>
  <script src="config.js"></script>
  <script src="view.js"></script>
  <script src="app.js"></script>
</body>
</html>
