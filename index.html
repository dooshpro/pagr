<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>pagr</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1><a href="/">pagr</a></h1>
  <p>pages for the people.</p>

  <h2>create a page</h2>
  <form id="create-form">
    <label for="content">content (required)</label><br>
    <textarea id="content" rows="12" required></textarea>
    <p>
      <button type="submit" id="save-btn">save and done</button>
      <span id="status"></span>
    </p>
  </form>

  <div id="result" hidden>
    <p>page saved. its address is:</p>
    <p><code id="result-link"></code></p>
    <p>fooooooooooooo</p>
    <button id="again-btn" type="button">make another</button>
  </div>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
