<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>pagr</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <h1><a href="/">pagr</a></h1>
  <p>pages for the people.</p>
  <noscript><p>pagr needs javascript to work.</p></noscript>

  <div id="create-view">
    <h2>create a page</h2>
    <form id="create-form">
      <label for="content">content</label><br>
      <textarea id="content" rows="12" maxlength="50000" required
  placeholder="# heading&#10;write here&#10;**bold**&#10;[link](https://link.com)&#10;![img](https://cat.png)&#10;lists with - or numbers."></textarea>
      <p>
        <label for="custom-slug">custom address</label><br>
        <input id="custom-slug" maxlength="32" placeholder="cool-webpage">
        <span id="slug-hint"></span><br>
        <code>3 to 32 chars</code>
      </p>
      <p>
        <button type="submit" id="save-btn">save and done</button>
        <span id="status"></span>
      </p>
    </form>

    <div id="result" hidden>
      <p>page saved. its address is:</p>
      <p><a id="result-link" href="/"></a></p>

      <h2>your edit code</h2>
      <p><input id="result-secret" size="48" readonly> <button id="copy-btn" type="button">copy</button></p>
      <p>save it somewhere safe. this is the only time you will see it. if you lose it nobody can reset it, there is no server to ask.</p>
      <button id="again-btn" type="button">make another</button>
    </div>
  </div>

  <div id="page-view" hidden>
    <p id="page-status"></p>
    <div id="page-content"></div>
    <hr>
    <p><a id="edit-link" href="/" hidden>edit this page</a></p>
    <p><a href="/">create your own page</a></p>
  </div>

  <div id="edit-view" hidden>
    <h2>edit page</h2>
    <p id="edit-status"></p>
    <form id="edit-form" hidden>
      <label for="edit-content">content</label><br>
      <textarea id="edit-content" rows="12" maxlength="50000"></textarea>
      <p>
        <label for="edit-secret">edit code</label><br>
        <input id="edit-secret" size="48">
      </p>
      <p>
        <button type="submit" id="edit-save-btn">save changes</button>
        <button type="button" id="edit-delete-btn">delete page</button>
        <a id="edit-cancel" href="/">cancel</a>
      </p>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js"></script>
  <script src="/config.js"></script>
  <script src="/keys.js"></script>
  <script src="/pages.js"></script>
  <script src="/cache.js"></script>
  <script src="/view.js"></script>
  <script src="/edit.js"></script>
  <script src="/app.js"></script>
</body>
</html>
